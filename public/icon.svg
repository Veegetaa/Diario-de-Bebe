<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D5A4D"/>
      <stop offset="100%" stop-color="#1B3830"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCECE4"/>
      <stop offset="100%" stop-color="#F6E3D9"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bg)"/>

  <!-- Subtle ring decoration -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#DCE9DF" stroke-width="4" stroke-opacity="0.2"/>

  <!-- Baby Silhouette / Heart / Star emblem -->
  <g filter="url(#shadow)">
    <!-- Main circular face/body -->
    <circle cx="256" cy="240" r="105" fill="url(#accent)"/>

    <!-- Cute little cheeks -->
    <ellipse cx="206" cy="260" rx="18" ry="12" fill="#F8B4A5" opacity="0.6"/>
    <ellipse cx="306" cy="260" rx="18" ry="12" fill="#F8B4A5" opacity="0.6"/>

    <!-- Smiling closed eyes -->
    <path d="M 190 236 Q 206 250 222 236" fill="none" stroke="#24473D" stroke-width="7" stroke-linecap="round"/>
    <path d="M 290 236 Q 306 250 322 236" fill="none" stroke="#24473D" stroke-width="7" stroke-linecap="round"/>

    <!-- Gentle baby smile -->
    <path d="M 236 270 Q 256 288 276 270" fill="none" stroke="#24473D" stroke-width="6" stroke-linecap="round"/>

    <!-- Cute pacifier / heart on bib -->
    <path d="M 256 312 C 246 300 228 300 228 316 C 228 332 256 348 256 348 C 256 348 284 332 284 316 C 284 300 266 300 256 312 Z" fill="#E26D5C"/>

    <!-- Small sprout hair lock -->
    <path d="M 256 135 C 256 105 280 110 274 135" fill="none" stroke="#24473D" stroke-width="7" stroke-linecap="round"/>
  </g>

  <!-- Twinkling stars -->
  <polygon points="120,130 125,142 137,147 125,152 120,164 115,152 103,147 115,142" fill="#F5E6A3" opacity="0.85"/>
  <polygon points="390,110 394,120 404,124 394,128 390,138 386,128 376,124 386,120" fill="#F5E6A3" opacity="0.85"/>
  <polygon points="380,360 383,368 391,371 383,374 380,382 377,374 369,371 377,368" fill="#F5E6A3" opacity="0.85"/>
</svg>
